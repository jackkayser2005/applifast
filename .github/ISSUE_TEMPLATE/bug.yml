name: Bug report
description: Something does not work, or the app crashed or vanished.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Applifast's playback preview currently supports Windows x64.
        Include the source revision from BUILD.txt and the relevant part of
        applifast.log after reproducing and quitting the app:

        - Windows: `%LOCALAPPDATA%\paolino\applifast\data\applifast.log`

        If the app crashed or vanished, include `panic.log` from the same folder.
        Older previews use spotifast.log in that Applifast data folder.
        Redact account names, private paths and song titles you do not want public.
        Never include tokens, passwords, signing keys, cookies or raw authorization responses.
  - type: input
    id: version
    attributes:
      label: Applifast source revision and how you installed it
      placeholder: "Source from BUILD.txt, portable preview ZIP / cargo run --locked"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: os_details
    attributes:
      label: System details
      description: Include the OS version and WebView2 Runtime version if known.
      placeholder: "Windows 11 24H2, WebView2 Runtime version"
    validations:
      required: true
  - type: input
    id: plan
    attributes:
      label: Apple Music access (optional)
      description: Subscription active, library visible, or sign-in failing. Do not include account identifiers.
  - type: textarea
    id: what
    attributes:
      label: What did you do, and what happened instead?
      placeholder: "1. Signed in. 2. Pressed play on a playlist. 3. Nothing played; the button kept spinning."
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Redacted log excerpt
      description: Include relevant diagnostic lines and panic.log if there is one. Review the text for private data before posting. Paths are above.
      render: text
    validations:
      required: false
