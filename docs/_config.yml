title: Applifast
spotifast_version: "0.12.0"
description: Apple Music for Windows with a native Rust interface and an independent MusicKit playback host.
lang: en-US
timezone: Europe/Berlin
url: https://spotifast.rocks
baseurl: ""
logo: /assets/images/logo.svg
image: /applifast/review-narrow-collections/after-loaded-dark-1100x760.png

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty
theme: jekyll-vitepress-theme

collections:
  guide:
    output: true
    permalink: "/:name/"
  reference:
    output: true
    permalink: "/:name/"

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /applifast/review-narrow-collections/after-loaded-dark-1100x760.png
      topics:
        - Apple Music client
        - Rust
        - egui
        - MusicKit
        - WebView2
        - Windows music player
  - scope:
      type: guide
    values:
      layout: default
  - scope:
      type: reference
    values:
      layout: default

jekyll_vitepress:
  seo:
    page_type: TechArticle
    image:
      path: /applifast/review-narrow-collections/after-loaded-dark-1100x760.png
      alt: Applifast Apple library with deterministic sample data
    publisher:
      type: Person
      name: Applifast contributors
      url: https://github.com/jackkayser2005/applifast
      same_as:
        - https://github.com/jackkayser2005/applifast
  llms:
    title: Applifast
    description: >-
      Documentation for the Windows Apple Music development preview.
      Covers authorization, library access, local queues and desktop controls.
    full: true
    details: >-
      Covers Windows installation, Apple sign-in, everyday use, storage,
      privacy and current release limits. Retained Spotify references are
      labeled separately. Source is on
      [GitHub](https://github.com/jackkayser2005/applifast).
  branding:
    site_title: Applifast
    logo:
      default: /assets/images/logo.svg
      alt: Applifast
  syntax:
    light_theme: github
    dark_theme: github.dark
  footer:
    enabled: true
    show_on_docs: false
    message: >-
      Applifast is an MIT-licensed fork of <a href="https://github.com/crmne/spotifast" target="_blank" rel="noreferrer">Spotifast by Carmine Paolino</a>.
    copyright: >-
      Docs built with <a href="https://jekyll-vitepress.dev" target="_blank" rel="noreferrer">Jekyll VitePress</a>. Applifast is independent of Apple and is not affiliated with or endorsed by Apple.
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%Y-%m-%d %H:%M"
  edit_link:
    enabled: true
    pattern: "https://github.com/jackkayser2005/applifast/edit/main/docs/:path"
    text: Edit this page on GitHub
  github_star:
    enabled: true
    repository: jackkayser2005/applifast
    text: Star
    show_count: true
  github_sponsor:
    enabled: true
    user: crmne
    text: Sponsor upstream

plugins:
  - jekyll-redirect-from
  - jekyll-vitepress-theme

exclude:
  - _site
  - .jekyll-cache
  - .sass-cache
  - .bundle
  - vendor
  - Gemfile
  - Gemfile.lock
