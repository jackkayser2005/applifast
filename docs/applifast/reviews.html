<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applifast integration comparisons</title>
<style>
body { font: 16px system-ui; background: #202022; color: #eee; margin: 20px; }
select, button { font: inherit; padding: 8px; margin: 4px; } a { color: #ff7a80; }
iframe { width: 100%; height: 90vh; border: 1px solid #666; }
</style>
<h1>Applifast integration comparisons</h1>
<p>Windows sample-data captures. Motion has a candidate gallery; its matching
baseline is still pending. Runtime and release checks remain separate.</p>
<button id="previous">Previous</button>
<label>Review <select id="review">
<option value="review-polish/index.html">PR #14: motion, cache and polish</option>
<option value="review-playlists/index.html">PR #15: create and save playlists</option>
<option value="review-playlist-additions/index.html">PR #16: append songs, albums and queue</option>
<option value="review-favorites/index.html">PR #17: favorites read/filter slice</option>
<option value="review-home/index.html">PR #18: Home feeds and album added dates</option>
<option value="review-lyrics/index.html">PR #19: Apple lyrics and full-screen words</option>
<option value="review-favorites-shelf/index.html">PR #20: Favorites page and sidebar shelf</option>
<option value="review-search/index.html">PR #21: Apple search pages and supported filters</option>
</select></label>
<button id="next">Next</button> <a id="direct">Open selected comparison</a>
<iframe id="comparison" title="Selected integration comparison"></iframe>
<script>
const byId = id => document.getElementById(id), review = byId('review');
function draw() {
  byId('comparison').src = review.value; byId('direct').href = review.value;
  byId('previous').disabled = review.selectedIndex === 0;
  byId('next').disabled = review.selectedIndex === review.options.length - 1;
}
review.onchange = draw;
byId('previous').onclick = () => { if (review.selectedIndex > 0) review.selectedIndex--; draw(); };
byId('next').onclick = () => { if (review.selectedIndex < review.options.length - 1) review.selectedIndex++; draw(); };
draw();
</script>
</html>
